name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Run local checks
        run: bash tests/run.sh
